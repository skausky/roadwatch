<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RoadWatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1724; --raise:#18233a; --line:#28344c; --ink:#ece6d6; --dim:#8d97ab;
  --police:#4a86ff; --vehicle:#ffb224; --alpr:#e062c0; --ok:#48c78e; --warn:#ff6b5a;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{--bg:#eef1f5;--raise:#fff;--line:#d5dbe4;--ink:#14202f;--dim:#5b6678;
        --police:#1f5fe0;--vehicle:#e39400;--alpr:#b0368f;--ok:#1f9d63;--warn:#d8412f;color-scheme:light}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  font-size:19px;line-height:1.3;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;
}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.link{display:flex;align-items:center;gap:10px;font-weight:500;color:var(--dim);font-size:19px;min-width:0}
.link span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--dim)}
.link[data-state=live]{color:var(--ink)}
.link[data-state=live] .dot{background:var(--ok)}
.link[data-state=warn] .dot{background:var(--warn)}
button{
  font:inherit;font-weight:600;font-size:19px;color:var(--ink);
  background:var(--raise);border:1px solid var(--line);border-radius:10px;
  padding:8px 16px;min-height:46px;cursor:pointer;
}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--police);outline-offset:2px}
main{flex:1;display:grid;grid-template-rows:auto minmax(0,1fr);gap:14px;padding:0 16px 8px;min-height:0}
.hero{
  border-radius:20px;padding:22px 20px 20px;background:var(--raise);
  border:1px solid var(--line);transition:background-color .25s,color .25s;
}
.hero-label{font-size:clamp(46px,14vw,80px);font-weight:700;line-height:.95;letter-spacing:-.01em}
.hero-sub{font-size:23px;font-weight:500;margin-top:8px;color:var(--dim)}
.meter{height:16px;border-radius:8px;background:rgba(127,127,127,.25);margin-top:20px;overflow:hidden}
.meter-fill{height:100%;width:0;background:var(--ink);border-radius:8px;transition:width .4s}
.hero-stats{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;min-height:31px}
.hero[data-cat="0"]{background:var(--police);border-color:var(--police);color:#fff}
.hero[data-cat="1"]{background:var(--vehicle);border-color:var(--vehicle);color:#1d1404}
.hero[data-cat="2"]{background:var(--alpr);border-color:var(--alpr);color:#fff}
.hero[data-cat] .hero-sub{color:inherit;opacity:.85}
.hero[data-cat] .meter{background:rgba(0,0,0,.2)}
.hero[data-cat] .meter-fill{background:currentColor}
@keyframes flash{from{filter:brightness(1.4)}to{filter:brightness(1)}}
.hero.fresh{animation:flash .7s ease-out}
.list{min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
h2{font-size:20px;font-weight:600;color:var(--dim);margin:2px 0 4px}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sw{align-self:stretch;border-radius:3px}
.l1{font-size:23px;font-weight:600;line-height:1.15}
.l2{font-size:16px;color:var(--dim);overflow-wrap:anywhere}
.r{text-align:right;font-variant-numeric:tabular-nums}
.r b{display:block;font-size:23px;font-weight:600}
.r span{font-size:16px;color:var(--dim)}
li.stale{opacity:.5}
li.low .l1{font-size:19px;font-weight:500;color:var(--dim)}
li.low .r b{font-size:19px;color:var(--dim)}
/* Devices view: everything the boards hear (survey stream) */
.dv-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 0 8px}
.dv-bar input{font:inherit;font-size:17px;flex:1 1 140px;min-width:0;padding:8px 10px;border-radius:10px;
  border:1px solid var(--line);background:var(--raise);color:var(--ink)}
.chip{min-height:38px;padding:4px 12px;font-size:17px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.l3{font-size:14px;color:var(--dim);overflow-wrap:anywhere;font-family:ui-monospace,Menlo,monospace}
#raw{margin:0;white-space:pre-wrap;word-break:break-all;font:12px/1.35 ui-monospace,Menlo,monospace;color:var(--dim)}
.empty{color:var(--dim);margin:8px 0}
.controls{display:flex;gap:8px;padding:8px 16px 12px;overflow-x:auto}
.controls button{flex:1 0 auto}
.toast{
  position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;
  font-size:19px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;
}
.toast.show{opacity:1}
@media (orientation:landscape) and (min-width:640px){
  main{grid-template-columns:1.15fr 1fr;grid-template-rows:minmax(0,1fr)}
  .hero{display:flex;flex-direction:column;justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  .hero.fresh{animation:none}.meter-fill,.hero{transition:none}
}
</style>
</head>
<body>
<header class="bar">
  <div class="link" id="link" data-state="off"><span class="dot"></span><span id="linkText">Not connected</span></div>
  <button id="connectBtn" class="primary">Connect</button>
</header>

<main>
  <section class="hero" id="hero" aria-live="polite">
    <div class="hero-label" id="heroLabel">All clear</div>
    <div class="hero-sub" id="heroSub">Connect your detector to start</div>
    <div class="meter" aria-hidden="true"><div class="meter-fill" id="meterFill"></div></div>
    <div class="hero-stats"><span id="heroTrend"></span><span id="heroRssi"></span></div>
  </section>

  <section class="list">
    <div id="alertView">
      <h2>Seen in the last 10 minutes</h2>
      <ul id="list"></ul>
      <p class="empty" id="empty">Nothing detected yet. Detections show up here as you drive.</p>
    </div>
    <div id="devView" hidden>
      <div class="dv-bar">
        <button class="chip" id="svBtn" aria-pressed="false">Stream off</button>
        <button class="chip" data-f="all" aria-pressed="true">All</button>
        <button class="chip" data-f="w" aria-pressed="false">Wi-Fi</button>
        <button class="chip" data-f="b" aria-pressed="false">BLE</button>
        <button class="chip" id="rawBtn" aria-pressed="false">Raw</button>
        <button class="chip" id="copySvBtn">Copy survey</button>
        <input id="dvFilter" type="search" placeholder="Filter: vendor, name, MAC, company ID" autocomplete="off">
      </div>
      <h2 id="dvCount">Turn the stream on to see everything the boards hear</h2>
      <ul id="devList"></ul>
      <pre id="raw" hidden></pre>
    </div>
  </section>
</main>

<footer class="controls">
  <button id="devBtn">Devices</button>
  <button id="markBtn">Mark</button>
  <button id="soundBtn">Sound on</button>
  <button id="demoBtn">Demo</button>
  <button id="copyBtn">Copy log</button>
  <button id="clearBtn">Clear</button>
</footer>
<div class="toast" id="toast" role="status"></div>

<script>
const SVC = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RX  = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';   // commands to the board
const TX  = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
// c:3 = low priority (Ring, CCTV, drones, your watchlist MACs): listed, never
// the hero, never a sound.
const CATS = ['Police gear', 'Emergency vehicle router', 'License plate camera', 'Low priority'];
const LOW = 3;
const ACTIVE_MS = 12000, KEEP_MS = 10 * 60 * 1000, REALERT_MS = 60000;

const $ = id => document.getElementById(id);
const tracks = new Map();
let device = null, wantConnected = false, reconnecting = false;
let lastHb = 0, hbInfo = null, rxBuf = '';
let sound = true, audio = null, wakeLock = null, pos = null, geoWatch = null;
let demoTimer = null, lastCloseBeep = 0, heroKey = null;
let log = loadLog();

/* Survey (Devices view): everything the boards hear, streamed on request.
   svRaw keeps the raw lines (plus phone time + GPS) for export. */
const SV_MAX = 4000, SV_FRESH_MS = 60000, SV_SHOW = 200;
const CID = { '004c':'Apple', '0006':'Microsoft', '00e0':'Google', '0075':'Samsung', '0171':'Amazon',
              '034d':'TASER/Axon', '09c8':'XUNTONG (Flock battery)', '0059':'Nordic', '02e5':'Espressif',
              '0087':'Garmin', '000f':'Broadcom' };
const UUID16 = { 'fc81':'Axon', 'fd5f':'Meta', '180f':'Battery', '180a':'DeviceInfo', 'feaa':'Eddystone',
                 'fe2c':'Google FastPair', 'fd6f':'ExposureNotif' };
const KIND = { bcn:'beacon', prq:'probe', prw:'wildcard probe', prs:'probe resp', mgt:'mgmt', dat:'data' };
let rxCh = null, svWanted = false, devView = false, rawOn = false, dvSrc = 'all', svSavedAt = 0;
const svDevs = new Map();
const apNames = new Map();   // BSSID -> SSID, from beacons / probe responses
let svRaw = loadSurvey();
function loadSurvey(){ try { return JSON.parse(localStorage.getItem('rw-survey') || '[]'); } catch(e){ return []; } }
function saveSurvey(force){
  const now = Date.now();
  if (!force && now - svSavedAt < 15000) return;
  svSavedAt = now;
  try { localStorage.setItem('rw-survey', JSON.stringify(svRaw.slice(-SV_MAX))); } catch(e){}
}
// The stream is a debug tool: off on every page load, on only when asked.

/* ---------- storage ---------- */
function loadLog(){ try { return JSON.parse(localStorage.getItem('rw-log') || '[]'); } catch(e){ return []; } }
function saveLog(){ try { localStorage.setItem('rw-log', JSON.stringify(log.slice(-2000))); } catch(e){} }
try { sound = localStorage.getItem('rw-sound') !== 'off'; } catch(e){}

/* ---------- bluetooth ---------- */
const linked = () => !!(device && device.gatt && device.gatt.connected);

async function connect(){
  if (!navigator.bluetooth){
    toast('This browser can’t use Bluetooth. On iPhone, open this page in the Bluefy app.');
    return;
  }
  unlockAudio();
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SVC] }, { namePrefix: 'RoadWatch' }],
      optionalServices: [SVC]
    });
  } catch(e){ return; } // user closed the picker
  device.addEventListener('gattserverdisconnected', onDisconnected);
  wantConnected = true;
  try { await attach(); }
  catch(e){ toast('Couldn’t connect. Make sure the detector is powered and nearby.'); onDisconnected(); }
  startGeo(); keepAwake();
}

async function attach(){
  renderLink();
  const server = await device.gatt.connect();
  const svc = await server.getPrimaryService(SVC);
  const ch = await svc.getCharacteristic(TX);
  ch.addEventListener('characteristicvaluechanged', onData);
  await ch.startNotifications();
  try { rxCh = await svc.getCharacteristic(RX); } catch(e){ rxCh = null; }
  if (svWanted) sendCmd({ cmd: 'sv', on: 1 });   // the board forgets on reconnect
  lastHb = Date.now();
  renderLink();
}

// Commands are one short JSON line (<= 20 bytes, so they fit before MTU exchange).
async function sendCmd(obj){
  if (!rxCh || !linked()) return false;
  const data = new TextEncoder().encode(JSON.stringify(obj) + '\n');
  try {
    if (rxCh.writeValueWithoutResponse) await rxCh.writeValueWithoutResponse(data);
    else await rxCh.writeValue(data);
    return true;
  } catch(e){ return false; }
}

async function onDisconnected(){
  renderLink();
  if (!wantConnected || reconnecting) return;
  reconnecting = true;
  let delay = 1000;
  while (wantConnected && !linked()){
    await new Promise(r => setTimeout(r, delay));
    if (!wantConnected) break;
    try { await attach(); } catch(e){ delay = Math.min(delay * 2, 10000); }
  }
  reconnecting = false;
  renderLink();
}

function disconnect(){
  wantConnected = false;
  if (linked()) device.gatt.disconnect();
  renderLink();
}

function onData(e){
  rxBuf += new TextDecoder().decode(e.target.value);
  let i;
  while ((i = rxBuf.indexOf('\n')) >= 0){
    const line = rxBuf.slice(0, i).trim();
    rxBuf = rxBuf.slice(i + 1);
    if (line) { try { handle(JSON.parse(line), false, line); } catch(err){} }
  }
  if (rxBuf.length > 1000) rxBuf = '';
}

/* ---------- detections ---------- */
function handle(msg, demo, line){
  if (msg.hb){ lastHb = Date.now(); hbInfo = msg; renderLink(); return; }
  if (msg.ack){ if (msg.ack === 'sv') renderSvBtn(!!msg.on); return; }
  if (msg.sv){ onSurvey(msg, line); return; }
  if (!msg.m) return;
  if (line && !demo) keepRaw(line);
  const now = Date.now();
  let t = tracks.get(msg.m);
  const isNew = !t || now - t.last > REALERT_MS;
  if (!t){ t = { mac: msg.m, best: -127, name: '' }; tracks.set(msg.m, t); }
  Object.assign(t, {
    label: msg.l, cat: msg.c | 0, src: msg.s === 'w' ? 'Wi-Fi' : 'Bluetooth',
    rssi: msg.r, trend: msg.t | 0, count: msg.n || 1, last: now,
    name: msg.nm || t.name, board: msg.b || t.board || '',
    md: msg.md || t.md || '', cf: msg.cf ?? t.cf
  });
  t.best = Math.max(t.best, msg.r);

  // "cl":1 = the firmware's strong-signal alarm (police / fleet gear within
  // tens of metres). Always sounds, on top of the normal alert.
  if (msg.cl && t.cat !== LOW) urgentSound();
  if (isNew){
    t.first = now;
    if (t.cat !== LOW) alertSound(t.cat);
    if (!demo){
      t.logEntry = { time: now, cat: t.cat, label: t.label, src: t.src, mac: t.mac,
                     best: t.rssi, lat: pos ? pos.lat : null, lon: pos ? pos.lon : null };
      log.push(t.logEntry); saveLog();
    }
  } else {
    if (t.logEntry && t.rssi > t.logEntry.best) t.logEntry.best = t.rssi;
    if (t.cat !== LOW && t.trend >= 4 && t.rssi > -70 && now - lastCloseBeep > 4000){ lastCloseBeep = now; closingSound(); }
  }
  render();
}

/* ---------- survey (Devices view) ---------- */
function keepRaw(line){
  svRaw.push({ ts: Date.now(), lat: pos ? pos.lat : null, lon: pos ? pos.lon : null, line });
  if (svRaw.length > SV_MAX) svRaw.splice(0, svRaw.length - SV_MAX);
  saveSurvey(false);
}

function onSurvey(msg, line){
  if (line) keepRaw(line);
  if (msg.sv === 'mark'){ toast('Mark ' + msg.k + ' saved on board ' + msg.b); return; }
  if (!msg.a) return;   // drops counters etc.
  const key = msg.b + ' ' + msg.a;
  let d = svDevs.get(key);
  if (!d){
    d = { a: msg.a, b: msg.b, s: msg.s, best: -127, n: 0, names: new Set(), ch: new Set(), k: new Set() };
    svDevs.set(key, d);
  }
  d.last = msg.r; d.best = Math.max(d.best, msg.br ?? msg.r); d.n = Math.max(d.n, msg.n || 0);
  d.rx = Date.now();
  ['ss', 'ss2', 'nm'].forEach(f => { if (msg[f]) d.names.add(msg[f]); });
  (msg.ch || '').split(',').filter(Boolean).forEach(c => d.ch.add(c));
  (msg.k || '').split(',').filter(Boolean).forEach(k => d.k.add(k));
  if (msg.v) d.v = msg.v;
  if (msg.bs) d.bs = msg.bs;
  // A beacon / probe-response SSID is that access point's own network name;
  // remember it so clients ("bs") can be shown as "on <network>".
  if (msg.ss && /bcn|prs/.test(msg.k || '')) apNames.set(msg.a, msg.ss);
  if (msg.cid){ d.cid = msg.cid; d.md = msg.md || ''; }
  if (msg.u) d.u = msg.u;
  if (msg.u128) d.u128 = msg.u128;
  if (msg.la !== undefined) d.rand = !!msg.la;
  if (msg.at !== undefined) d.rand = msg.at === 1 || msg.at === 3;
}

const oui = mac => mac.slice(0, 8).toUpperCase();

// Alerting devices first (police > fleet > Flock > low), then what's been
// heard in the last minute, strongest first; everything older after that.
function devRank(d, now){
  const t = tracks.get(d.a);
  const cat = t ? [4, 3, 2, 1][t.cat] || 0 : 0;
  return cat * 1000 + (now - d.rx < SV_FRESH_MS ? 500 : 0) + (d.last ?? -127);
}

// A Wi-Fi device that never beacons isn't an access point: its SSIDs are
// networks it's searching for (probe requests), not its own name.
const isAp = d => d.k.has('bcn') || d.k.has('prs');

// "on HomeNet" for a client whose access point we know.
function netOf(d){
  if (!d.bs) return '';
  const ssid = apNames.get(d.bs);
  if (ssid) return ssid;
  const ap = svDevs.get(d.b + ' ' + d.bs);
  return 'hidden network ' + d.bs + (ap && ap.v ? ' (' + ap.v + ')' : '');
}

function devTitle(d){
  const name = (d.s !== 'w' || isAp(d)) ? [...d.names][0] : '';
  if (name) return name;
  if (d.s === 'w' && d.bs && apNames.get(d.bs)) return 'Client of ' + apNames.get(d.bs);
  if (d.v) return d.v;
  if (d.cid) return CID[d.cid] ? CID[d.cid] + ' device' : 'Company 0x' + d.cid;
  return d.rand ? 'Randomized address' : 'OUI ' + oui(d.a);
}

function devDetail(d){
  const parts = [];
  if (d.s === 'w'){
    if (d.ch.size) parts.push('ch ' + [...d.ch].sort((x, y) => x - y).join(','));
    if (d.k.size) parts.push([...d.k].map(k => KIND[k] || k).join(', '));
    if (d.bs) parts.push('on ' + netOf(d));
    if (!isAp(d) && d.names.size) parts.push('looking for ' + [...d.names].join(', '));
  } else {
    if (d.cid) parts.push('cid ' + d.cid + (CID[d.cid] ? ' ' + CID[d.cid] : '') + (d.md ? ' ' + d.md : ''));
    if (d.u) parts.push('svc ' + d.u.split(',').map(u => u + (UUID16[u] ? ' ' + UUID16[u] : '')).join(', '));
    if (d.u128) parts.push(d.u128 + '× 128-bit svc');
  }
  if (d.names.size > 1 && (d.s !== 'w' || isAp(d))) parts.push('also ' + [...d.names].slice(1).join(', '));
  parts.push(d.n + ' hits');
  return parts.join(' · ');
}

function renderDev(now){
  if (rawOn){
    $('devList').hidden = true; $('raw').hidden = false;
    $('dvCount').textContent = 'Raw log: last 150 of ' + svRaw.length + ' lines, newest at the bottom';
    $('raw').textContent = svRaw.slice(-150).map(e => e.line).join('\n');
    return;
  }
  $('devList').hidden = false; $('raw').hidden = true;
  const q = $('dvFilter').value.trim().toLowerCase();
  let items = [...svDevs.values()].filter(d => dvSrc === 'all' || d.s === dvSrc);
  if (q) items = items.filter(d =>
    [d.a, d.v, d.cid, CID[d.cid], d.u, d.bs, apNames.get(d.bs), ...d.names].filter(Boolean).join(' ').toLowerCase().includes(q));
  items.sort((x, y) => devRank(y, now) - devRank(x, now));
  $('dvCount').textContent = !svDevs.size
    ? (svWanted ? 'Stream on, waiting for data…' : 'Turn the stream on to see everything the boards hear')
    : items.length + ' devices' + (items.length > SV_SHOW ? ' (top ' + SV_SHOW + ' shown)' : '')
      + (svWanted ? '' : ' · stream off');
  $('devList').innerHTML = items.slice(0, SV_SHOW).map(d => {
    const t = tracks.get(d.a);
    return `
    <li class="${now - d.rx > SV_FRESH_MS ? 'stale' : ''} ${t ? '' : 'low'}">
      <span class="sw" style="background:${t ? catColor(t.cat) : 'var(--line)'}"></span>
      <div>
        <div class="l1">${esc(t ? t.label : devTitle(d))}</div>
        <div class="l2">${d.s === 'w' ? 'Wi-Fi' : 'Bluetooth'} (board ${esc(d.b)}), ${esc(d.a)}${d.rand ? ' random' : ''}${d.v ? ', ' + esc(d.v) : ''}</div>
        <div class="l3">${esc(devDetail(d))}</div>
      </div>
      <div class="r"><b>${d.last} dBm</b><span>best ${d.best}<br>${ago(now - d.rx)}</span></div>
    </li>`;
  }).join('');
}

function renderSvBtn(on){
  const b = $('svBtn');
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.textContent = on ? 'Stream on' : 'Stream off';
}

async function toggleStream(){
  svWanted = !svWanted;
  renderSvBtn(svWanted);
  if (!(await sendCmd({ cmd: 'sv', on: svWanted ? 1 : 0 })) && svWanted)
    toast('Saved. The stream starts when the detector is connected.');
  render();
}

async function mark(){
  const n = svRaw.filter(e => e.line.includes('"sv":"pmark"')).length + 1;
  keepRaw('{"sv":"pmark","k":' + n + '}');   // phone-side mark, carries GPS even with the stream off
  saveSurvey(true);
  const sent = await sendCmd({ cmd: 'mark' });
  toast(sent ? 'Mark ' + n + ' (phone) sent to the detector' : 'Mark ' + n + ' saved on the phone only (not connected)');
}

async function copySurvey(){
  if (!svRaw.length){ toast('No survey data yet. Turn the stream on first.'); return; }
  const text = svRaw.map(e => '{"ts":"' + new Date(e.ts).toISOString() + '","lat":' + (e.lat ?? 'null')
    + ',"lon":' + (e.lon ?? 'null') + ',"d":' + e.line + '}').join('\n');
  try { await navigator.clipboard.writeText(text); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast('Copied ' + svRaw.length + ' survey lines (JSON, with time + GPS)');
}

/* ---------- rendering ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const catColor = c => ['var(--police)','var(--vehicle)','var(--alpr)'][c] || 'var(--dim)';
const pct = r => Math.max(3, Math.min(100, (r + 95) / 55 * 100));
function ago(ms){
  const s = Math.round(ms / 1000);
  if (s < 5) return 'now';
  if (s < 60) return s + 's ago';
  return Math.round(s / 60) + ' min ago';
}

function pickHero(now){
  let best = null, score = -1e9;
  for (const t of tracks.values()){
    if (t.cat === LOW || now - t.last > ACTIVE_MS) continue;
    const s = t.rssi + (t.cat === 0 ? 10 : t.cat === 1 ? 5 : 0);
    if (s > score){ score = s; best = t; }
  }
  return best;
}

function renderHero(now){
  const h = pickHero(now), el = $('hero');
  if (!h){
    el.removeAttribute('data-cat');
    $('heroLabel').textContent = 'All clear';
    $('heroSub').textContent = (linked() || demoTimer) ? 'Nothing nearby right now' : 'Connect your detector to start';
    $('meterFill').style.width = '0%';
    $('heroRssi').textContent = ''; $('heroTrend').textContent = '';
    heroKey = null; return;
  }
  el.dataset.cat = h.cat;
  if (heroKey !== h.mac){ heroKey = h.mac; el.classList.remove('fresh'); void el.offsetWidth; el.classList.add('fresh'); }
  $('heroLabel').textContent = h.label;
  $('heroSub').textContent = CATS[h.cat] + ' over ' + h.src;
  $('meterFill').style.width = pct(h.rssi) + '%';
  $('heroRssi').textContent = h.rssi + ' dBm';
  $('heroTrend').textContent = h.trend >= 3 ? 'Getting closer' : h.trend <= -3 ? 'Moving away' : 'Holding steady';
}

function renderList(now){
  // Important hits first (newest first), low priority underneath.
  const items = [...tracks.values()].filter(t => now - t.last < KEEP_MS)
    .sort((a, b) => ((a.cat === LOW) - (b.cat === LOW)) || (b.last - a.last));
  $('empty').hidden = items.length > 0;
  $('list').innerHTML = items.map(t => `
    <li class="${now - t.last > ACTIVE_MS ? 'stale' : ''} ${t.cat === LOW ? 'low' : ''}">
      <span class="sw" style="background:${catColor(t.cat)}"></span>
      <div>
        <div class="l1">${esc(t.label)}</div>
        <div class="l2">${esc(t.src)}${t.board ? ' (board ' + esc(t.board) + ')' : ''}, ${esc(t.mac)}${t.name ? ', ' + esc(t.name) : ''}</div>
        <div class="l3">${esc(alertDetail(t))}</div>
      </div>
      <div class="r"><b>${t.rssi} dBm</b><span>${ago(now - t.last)}</span></div>
    </li>`).join('');
}

// OUI, how it was matched and how sure; channel(s) if the survey heard it too.
function alertDetail(t){
  const parts = ['OUI ' + oui(t.mac)];
  if (t.md) parts.push('via ' + t.md);
  if (t.cf !== undefined) parts.push('confidence T' + t.cf);
  const sd = svDevs.get((t.board || 'A') + ' ' + t.mac);
  if (sd && sd.ch.size) parts.push('ch ' + [...sd.ch].sort((x, y) => x - y).join(','));
  if (sd && sd.bs) parts.push('on ' + netOf(sd));
  return parts.join(' · ');
}

function renderLink(){
  const el = $('link'), txt = $('linkText'), btn = $('connectBtn');
  if (linked()){
    const quiet = Date.now() - lastHb > 6000;
    el.dataset.state = quiet ? 'warn' : 'live';
    // fr / ba = Wi-Fi packets / board B's BLE adverts in the last 2 s heartbeat,
    // shown per second and labelled as rates: a bare number read like a
    // (5 GHz) channel. Both boards are 2.4 GHz only. A BLE rate of 0 while B
    // is linked means B's scanner isn't hearing anything. Firmware with "fr"
    // hops channels 4x a second, so its "ch" isn't worth showing.
    const perSec = n => Math.round(n / 2);
    txt.textContent = quiet ? 'Connected, no data from detector'
      : 'Scanning' + (hbInfo && hbInfo.fr === undefined ? ' channel ' + hbInfo.ch : '')
        + (hbInfo && hbInfo.fr !== undefined ? ', Wi-Fi ' + perSec(hbInfo.fr) + ' pkt/s' : '')
        + (hbInfo && hbInfo.bl !== undefined
            ? (hbInfo.bl ? ', board B linked' + (hbInfo.ba !== undefined ? ' (BLE ' + perSec(hbInfo.ba) + '/s)' : '')
                         : ', board B offline')
            : '')
        // qd / od: detections the firmware couldn't queue or deliver — should be 0.
        + (hbInfo && (hbInfo.qd || hbInfo.od) ? ' — LOST ' + ((hbInfo.qd | 0) + (hbInfo.od | 0)) + ' hits' : '');
    btn.textContent = 'Disconnect';
  } else if (wantConnected){
    el.dataset.state = 'warn'; txt.textContent = 'Reconnecting…'; btn.textContent = 'Disconnect';
  } else if (demoTimer){
    el.dataset.state = 'live'; txt.textContent = 'Demo mode'; btn.textContent = 'Connect';
  } else {
    el.dataset.state = 'off'; txt.textContent = 'Not connected'; btn.textContent = 'Connect';
  }
}

function render(){
  const now = Date.now();
  renderHero(now);
  if (devView) renderDev(now); else renderList(now);
}

/* ---------- sound ---------- */
function unlockAudio(){
  if (navigator.audioSession) { try { navigator.audioSession.type = 'playback'; } catch(e){} }
  if (!audio){ const AC = window.AudioContext || window.webkitAudioContext; if (AC) audio = new AC(); }
  if (audio && audio.state === 'suspended') audio.resume();
}
function tone(freq, start, dur, type = 'square', gain = .16){
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(gain, start);
  g.gain.exponentialRampToValueAtTime(.001, start + dur);
  o.connect(g).connect(audio.destination);
  o.start(start); o.stop(start + dur + .02);
}
function alertSound(cat){
  if (!sound || !audio) return;
  const t = audio.currentTime + .02;
  if (cat === 0) [0,1,2,3].forEach(i => tone(i % 2 ? 740 : 990, t + i * .18, .16));
  else if (cat === 1) { tone(660, t, .15); tone(660, t + .25, .15); }
  else tone(440, t, .45, 'sine', .25);
}
function urgentSound(){
  if (!sound || !audio) return;
  const t = audio.currentTime + .05;
  for (let i = 0; i < 12; i++) tone(i % 2 ? 880 : 1320, t + i * .1, .08, 'square', .22);
}
function closingSound(){ if (sound && audio) tone(1200, audio.currentTime + .02, .08); }

/* ---------- location, wake lock, toast ---------- */
function startGeo(){
  if (geoWatch !== null || !navigator.geolocation) return;
  geoWatch = navigator.geolocation.watchPosition(
    p => { pos = { lat: +p.coords.latitude.toFixed(5), lon: +p.coords.longitude.toFixed(5) }; },
    () => {}, { enableHighAccuracy: true, maximumAge: 5000 });
}
async function keepAwake(){
  try {
    if ('wakeLock' in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch(e){}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (linked() || demoTimer)) keepAwake();
});
let toastTimer;
function toast(msg){
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

/* ---------- demo ---------- */
function toggleDemo(){
  if (demoTimer){ clearInterval(demoTimer); demoTimer = null; $('demoBtn').textContent = 'Demo'; renderLink(); render(); return; }
  unlockAudio(); keepAwake();
  $('demoBtn').textContent = 'Stop demo';
  let k = 0;
  demoTimer = setInterval(() => {
    k++;
    const ph = k % 40, rising = ph < 20;
    const r = rising ? -92 + ph * 2 : -52 - (ph - 20) * 2;
    handle({ m:'00:25:df:0d:e0:01', l:'Axon device', c:0, s:'b', r, t: rising ? 4 : -4, n:k, nm:'' }, true);
    if (k % 15 === 5) handle({ m:'00:30:44:0d:e0:02', l:'Cradlepoint router', c:1, s:'w', r:-78, t:1, n:k, nm:'IBR900-3f1' }, true);
    if (k % 30 === 25) handle({ m:'b4:1e:52:0d:e0:03', l:'Flock camera', c:2, s:'w', r:-84, t:0, n:1, nm:'Flock-7A21' }, true);
    if (k % 10 === 3) handle({ m:'00:b4:63:0d:e0:04', l:'Ring camera', c:3, s:'w', r:-80, t:0, n:k, nm:'' }, true);
  }, 1000);
  renderLink();
}

/* ---------- log export ---------- */
function csv(){
  const rows = [['time','type','label','source','mac','best_rssi','lat','lon']];
  log.forEach(e => rows.push([new Date(e.time).toISOString(), CATS[e.cat], e.label, e.src, e.mac, e.best, e.lat ?? '', e.lon ?? '']));
  return rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
}
async function copyLog(){
  if (!log.length){ toast('The log is empty. Detections are logged as you drive.'); return; }
  const text = csv();
  try { await navigator.clipboard.writeText(text); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast('Copied ' + log.length + ' detections as CSV');
}

/* ---------- wiring ---------- */
$('connectBtn').onclick = () => (linked() || wantConnected) ? disconnect() : connect();
$('demoBtn').onclick = toggleDemo;
$('copyBtn').onclick = copyLog;
$('clearBtn').onclick = () => {
  if (!confirm('Clear the screen, the saved log and the survey data?')) return;
  tracks.clear(); log = []; saveLog();
  svDevs.clear(); apNames.clear(); svRaw = []; saveSurvey(true);
  render(); toast('Cleared');
};
$('devBtn').onclick = () => {
  devView = !devView;
  $('alertView').hidden = devView; $('devView').hidden = !devView;
  $('devBtn').textContent = devView ? 'Alerts' : 'Devices';
  render();
};
$('markBtn').onclick = mark;
$('svBtn').onclick = toggleStream;
$('rawBtn').onclick = () => {
  rawOn = !rawOn;
  $('rawBtn').setAttribute('aria-pressed', rawOn ? 'true' : 'false');
  render();
};
$('copySvBtn').onclick = copySurvey;
document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
  dvSrc = b.dataset.f;
  document.querySelectorAll('[data-f]').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  render();
});
$('dvFilter').oninput = () => render();
renderSvBtn(svWanted);
$('soundBtn').onclick = () => {
  sound = !sound; unlockAudio();
  $('soundBtn').textContent = sound ? 'Sound on' : 'Sound off';
  try { localStorage.setItem('rw-sound', sound ? 'on' : 'off'); } catch(e){}
};
$('soundBtn').textContent = sound ? 'Sound on' : 'Sound off';
setInterval(() => { render(); renderLink(); }, 1000);
render(); renderLink();
</script>
